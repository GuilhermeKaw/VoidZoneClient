<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoidZone</title>

<!-- ADICIONE A LINHA ABAIXO PARA O ÍCONE DA ABA -->
<link rel="icon" type="image/png" href="./imagem/VoidZone em Vermelho e Preto.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOBBY -->
<main id="lobby" class="lobby">
  <section class="card">
    <h1 class="brand-title"><i class="fa-solid fa-satellite-dish"></i> VoidZone - Telagens</h1>
    
    <form id="form" autocomplete="off">
      <label>
        <span class="t">Identificação (Apelido)</span>
        <input id="name" maxlength="20" placeholder="Ex: FlavinhoDoPneu" autocomplete="off">
      </label>
      
      <label>
        <span class="t">Hash da Sala (Código)</span>
        <div class="row">
          <input id="code" maxlength="24" placeholder="Ex: x7f9a" autocapitalize="off" spellcheck="false" autocomplete="off">
          <button type="button" id="gen" class="btn" title="Gerar código aleatório">
            <i class="fa-solid fa-shuffle"></i> Gerar
          </button>
        </div>
      </label>
      
      <button type="submit" id="join" class="btn primary">Iniciar Conexão</button>
    </form>
    <div id="lobbyMsg" role="status"></div>

    <!-- Créditos -->
    <div class="credits">
      Developer <a href="https://github.com/GuilhermeKaw" target="_blank" rel="noopener noreferrer">@GuilhermeKaw</a>
    </div>
  </section>
</main>

<!-- SALA -->
<div id="room" hidden>
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="fa-solid fa-satellite-dish"></i> VoidZone
    </div>
    
    <div class="room-info-box">
      <div class="room-info-label">CÓDIGO DA SALA</div>
      <div class="room-id-row">
        <b id="roomLabel"></b>
        <button type="button" id="copy" class="btn-icon" title="Copiar Link">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <div class="users-section">
      <span id="count"></span>
      <div id="people" class="people"></div>
    </div>

    <div class="sidebar-footer">
      <button type="button" id="leave" class="btn btn-danger">
        <i class="fa-solid fa-phone-slash"></i> Desconectar
      </button>
      <div class="f11-warning">
        <i class="fa-solid fa-circle-info"></i> Recomendado usar o botão de tela cheia do vídeo (evite o F11).
      </div>
      <!-- Créditos -->
      <div class="credits">
        Developer <a href="https://github.com/GuilhermeKaw" target="_blank" rel="noopener noreferrer">@GuilhermeKaw</a>
      </div>
    </div>
  </aside>

  <main class="stage">
    <header class="topbar">
      <div class="actions">
        <div class="settings-group">
          <select id="resSelect" class="select-ui" title="Resolução">
            <option value="720">720p</option>
            <option value="1080" selected>1080p</option>
            <option value="1440">1440p</option>
          </select>
          <select id="fpsSelect" class="select-ui" title="FPS (Quadros por segundo)">
            <option value="30" selected>30 FPS</option>
            <option value="60">60 FPS</option>
            <option value="90">90 FPS</option>
          </select>
        </div>
        
        <button type="button" id="share" class="btn">
          <i class="fa-solid fa-desktop"></i> <span>Compartilhar</span>
        </button>
      </div>
    </header>

    <div class="video-area">
      <div id="empty" class="empty">
        <i class="fa-solid fa-video-slash"></i>
        <div>
          <strong>Sinal Ausente</strong>
          <p>Ninguém está transmitindo. Clique em Compartilhar para iniciar.</p>
        </div>
      </div>
      <section id="grid" class="grid"></section>
    </div>
  </main>
</div>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="script.js"></script>
</body>
</html>
